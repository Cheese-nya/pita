[package]
name = "pita-hook"
version = "0.1.0"
description = "Zero-shell local invocation hook helper for Pita"
authors = ["Pita Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.78"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
